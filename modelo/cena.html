<script type="module">
import * as THREE from 'three';
const {WORDS,MK}=window;
const DUR=MK.fim+1.6;
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>u*u*(3-2*u);
const easeOutBack=u=>{const c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)};
const pop=(t,t0,d=.3)=>t<t0?0:easeOutBack(clamp((t-t0)/d));
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const SFX=[];window.SFX=SFX;

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xd6efff,80,200);
const camera=new THREE.PerspectiveCamera(50,W/H,0.1,400);

const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.92,metalness:0,flatShading:true,...o});
function mesh(geo,mat,x=0,y=0,z=0,parent=scene,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m;}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

// luz
scene.add(new THREE.HemisphereLight(0xd4ecff,0xa39c8c,1.5));
const sun=new THREE.DirectionalLight(0xfff2dc,2.7);sun.position.set(22,38,20);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:120});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;scene.add(sun);

// chão e ruas
const ground=mesh(new THREE.PlaneGeometry(500,500),M(0x6cc24a),0,0,0,scene,false);ground.rotation.x=-Math.PI/2;
const ROADZ=[4,-13.5,22.5],ROADX=[-13.5,13.5];
const asphalt=M(0x585d64),stripe=M(0xf4f4f4),walk=M(0xd8d2c6);
for(const z of ROADZ){mesh(new THREE.BoxGeometry(240,0.03,3),asphalt,0,0.015,z,scene,false);
  for(let x=-80;x<=80;x+=4)mesh(new THREE.BoxGeometry(1.6,0.035,0.16),stripe,x,0.03,z,scene,false);}
for(const x of ROADX)mesh(new THREE.BoxGeometry(3,0.031,240),asphalt,x,0.016,0,scene,false);

// árvores e casas do bairro
function tree(x,z,s=1,c=0x4caf50){mesh(new THREE.CylinderGeometry(.12*s,.17*s,1.1*s,6),M(0x7a5232),x,.55*s,z);mesh(new THREE.IcosahedronGeometry(.95*s,0),M(c),x,1.75*s,z);mesh(new THREE.IcosahedronGeometry(.65*s,0),M(c),x+.2*s,2.45*s,z-.1*s);}
const HC=[[0xf3a9b6,0xd84a3a],[0xbfe0f0,0xb03a2e],[0xf6e3b4,0xd84a3a],[0xc8e6c9,0x8d4b2f],[0xffe0b2,0x6d4c41],[0xd1c4e9,0xc0392b]];
const TC=[0x43a047,0x5cbf4a,0x4caf50];
function house(x,z,wall,roof,rot=0){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
  mesh(new THREE.BoxGeometry(4,2.6,3.6),M(wall),0,1.3,0,g);const r=mesh(new THREE.ConeGeometry(3.3,1.5,4),M(roof),0,3.35,0,g);r.rotation.y=Math.PI/4;r.scale.z=0.95;
  mesh(new THREE.BoxGeometry(.8,1.4,.05),M(0x7a4a2a),0,.7,1.82,g);mesh(new THREE.BoxGeometry(.9,.7,.05),M(0xbfe4ff),1.2,1.5,1.82,g);}
const LIVRE=new Set(['0,0','0,9','9,9']);
for(let gx=-45;gx<=45;gx+=9)for(let gz=-45;gz<=45;gz+=9){
  if(LIVRE.has(gx+','+gz))continue;
  const jx=(rnd()-.5)*1.4,jz=(rnd()-.5)*1.0;
  if(rnd()<.22){tree(gx+jx,gz+jz,1.1+rnd()*.5,TC[(rnd()*3)|0]);continue;}
  const c=HC[(rnd()*HC.length)|0];house(gx+jx,gz+jz,c[0],c[1],rnd()<.5?0:Math.PI);
  if(rnd()<.5)tree(gx+jx+3.3,gz+jz-2.6,.8+rnd()*.4,TC[(rnd()*3)|0]);
}
for(const [x,z] of [[-3.6,-3.2],[3.6,-3.4],[-2,9.4]])tree(x,z,1.1,TC[1]);
for(const [x,y,z,s] of [[-30,26,-70,2.4],[10,30,-85,3],[40,24,-60,2.2],[-60,28,-50,2.6]]){const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);
  for(const [dx,dy,r] of [[0,0,1.4],[1.4,.2,1.1],[-1.3,-.1,1],[.5,.8,1]])mesh(new THREE.IcosahedronGeometry(r*s,1),M(0xffffff,{emissive:0xffffff,emissiveIntensity:.15}),dx*s,dy*s,0,g,false);}

// a loja
const store=new THREE.Group();store.position.set(0,0,-0.6);scene.add(store);
const wallMat=M(0xfff3e0);
mesh(new THREE.BoxGeometry(5,3.6,4),wallMat,0,1.8,0,store);
mesh(new THREE.BoxGeometry(5.3,.3,4.3),M(0x8d6e63),0,3.75,0,store);
mesh(new THREE.BoxGeometry(1.1,2,.08),M(0x90caf9),0,1,2.02,store);
for(const s of [-1,1])mesh(new THREE.BoxGeometry(1.25,1.1,.08),M(0xbfe4ff),s*1.65,1.35,2.02,store);
for(let i=0;i<8;i++){const a=mesh(new THREE.BoxGeometry(5.2/8,.06,1.0),M(i%2?0xffffff:0xe53935),-2.6+5.2/16+i*5.2/8,2.38,2.45,store);a.rotation.x=.38;}
const signTex=canvasTex(720,160,(c,w,h)=>{c.fillStyle='#1e3a8a';rr(c,0,0,w,h,26);c.fill();c.fillStyle='#fff';c.font='900 96px Montserrat';c.textAlign='center';c.textBaseline='middle';c.fillText('SUA LOJA',w/2,h/2+6);});
const sign=new THREE.Mesh(new THREE.PlaneGeometry(3.6,.8),new THREE.MeshBasicMaterial({map:signTex}));sign.position.set(0,3.08,2.05);store.add(sign);
// pino de mapa sobre a loja

function person({shirt,pants,skin,hair}){
  const g=new THREE.Group();scene.add(g);
  const legs=[];for(const s of [-1,1]){const l=new THREE.Group();l.position.set(s*.11,.58,0);g.add(l);mesh(new THREE.CylinderGeometry(.09,.09,.58,8),M(pants),0,-.29,0,l);mesh(new THREE.BoxGeometry(.16,.08,.24),M(0x2b2b2b),0,-.54,.04,l);legs.push(l);}
  mesh(new THREE.CapsuleGeometry(.21,.34,4,10),M(shirt),0,.86,0,g);
  const head=new THREE.Group();head.position.set(0,1.3,0);g.add(head);
  mesh(new THREE.SphereGeometry(.2,12,10),M(skin),0,.05,0,head);
  mesh(new THREE.SphereGeometry(.215,12,8,0,Math.PI*2,0,Math.PI/2.2),M(hair),0,.07,-.02,head);
  for(const s of [-1,1])mesh(new THREE.SphereGeometry(.028,6,6),M(0x111111),s*.075,.06,.185,head);
  const arms=[];for(const s of [-1,1]){const a=new THREE.Group();a.position.set(s*.28,1.07,0);g.add(a);mesh(new THREE.CylinderGeometry(.065,.065,.5,8),M(skin),0,-.25,0,a);arms.push(a);}
  const phoneMat=M(0x222222,{emissive:0x000000});
  mesh(new THREE.BoxGeometry(.16,.26,.035),phoneMat,0,-.52,.05,arms[1]);
  arms[1].rotation.x=-1.15;
  g.scale.setScalar(1.3);return {g,head,legs,arms,phoneMat};
}
const SHIRT=[0xf5c518,0x1e88e5,0xe53935,0x8e24aa,0xff7043,0x26a69a,0xffffff,0x5c6bc0],PANTS=[0x2f55b5,0x37474f,0x6d4c41,0x263238],SKIN=[0xe2a878,0xc68642,0x8d5524,0xf1c27d],HAIR=[0x3b2314,0x111111,0x8d5524,0xd4a017];
const pick=a=>a[(rnd()*a.length)|0];
function mkPerson(x,z,o={}){const p=person({shirt:pick(SHIRT),pants:pick(PANTS),skin:pick(SKIN),hair:pick(HAIR)});
  return Object.assign(p,{hx:x,hz:z,dx:1,dz:0,amp:1.1,w:.6+rnd()*.3,ph:rnd()*6.28,still:false},o);}

  .concat([[13.5,-24],[-13.5,-30],[13.5,31],[-13.5,28]].map(([x,z])=>mkPerson(x,z,{dx:0,dz:1,amp:1.6})))

  for(let i=0;i<n;i++){const d=mesh(new THREE.BoxGeometry(.2,.06,.42),M(0xff9800,{emissive:0x7a3a00}),0,0,0,scene,false);d.position.lerpVectors(A,B,(i+.5)/n);d.rotation.y=ang;dashes.push(d);}}

// cards de anúncio voando pro Brasil inteiro
const adTexMini=canvasTex(200,300,(c,w,h)=>{c.fillStyle='#fff';rr(c,4,4,w-8,h-8,22);c.fill();c.fillStyle='#ff9800';c.beginPath();c.arc(36,36,18,0,7);c.fill();
  c.fillStyle='#ccc';c.fillRect(64,26,100,10);c.fillRect(64,44,64,8);c.fillStyle='#8fcdfc';c.fillRect(16,70,w-32,130);c.fillStyle='#e53935';c.fillRect(56,120,88,60);

for(let i=0;i<56;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:adTexMini,transparent:true}));s.scale.set(1.6,2.4,1);s.visible=false;scene.add(s);
  cards.push({s,th:i*2.399+rnd()*.4,t0:BURST+i*.06,hy:3+rnd()*6,sp:13+rnd()*9});}

const bubbles=[];
insiders.forEach((p,i)=>{for(const [base,step] of [[MK.clica+.05,.2],[MK.conta+.1,.26]]){

let adTex,chatTex;

  c.fillStyle='#90caf9';c.fillRect(240,590,60,100);c.fillStyle='#bfe4ff';c.fillRect(140,590,70,60);c.fillRect(330,590,70,60);

const cap=document.getElementById('cap');

// câmera
const K=[
  [0,[0,1.9,9.6],[0,2.1,0]],
  [MK.km1,[0,2.1,9.3],[0,2.2,0]],
  [MK.km1+2.2,[2,14,23],[4,0,3]],
  [MK.sabe,[3,13,22],[4.5,0,3.5]],
  [MK.essa-.1,[12,2.7,11.2],[8.5,1.7,6.1]],
  [MK.impulsiona-.3,[11.6,2.9,10.8],[8.5,1.7,6.1]],
  [MK.impulsiona+1.0,[6,30,42],[0,0,0]],
  [MK.brasil,[8,56,72],[0,0,-12]],
  [MK.no,[8,60,74],[0,0,-12]],
  [MK.no+1.7,[0,54,31],[0,0,0]],
  [MK.so-.4,[0,51,29],[0,0,0]],
  [MK.so+.7,[17,19,25],[0,0,0]],
  [MK.botao-.1,[19,17,21],[0,0,0]],
  [MK.botao+.6,[-3,2.6,11.2],[-5,1.6,6.2]],
  [MK.entao,[-3.3,2.7,11.6],[-5,1.6,6.2]],
  [MK.ve+.3,[12,17,27],[0,1,2]],
  [MK.conta-.1,[10,15,23],[0,1,2]],
  [MK.conta+.7,[5,7.4,15],[0,3,0]],
  [MK.vinte-.2,[4.4,7,13.6],[0,3,0]],
  [MK.vinte+.4,[8,4.6,12],[2.6,1.5,2]],
  [MK.manda-.2,[7.4,4.3,11],[2.6,1.5,2]],
  [MK.manda+1.1,[-14,22,28],[0,0,0]],
  [DUR,[-21,25,22],[0,0,0]],
];
const _p=new THREE.Vector3(),_l=new THREE.Vector3();
function cam(t){
  let i=0;while(i<K.length-2&&t>K[i+1][0])i++;
  const [t0,p0,l0]=K[i],[t1,p1,l1]=K[i+1];const u=ease(clamp((t-t0)/(t1-t0)));
  _p.set(lerp(p0[0],p1[0],u),lerp(p0[1],p1[1],u),lerp(p0[2],p1[2],u));
  _l.set(lerp(l0[0],l1[0],u),lerp(l0[1],l1[1],u),lerp(l0[2],l1[2],u));
  camera.position.copy(_p);camera.lookAt(_l);camera.updateMatrixWorld();
}

const _v=new THREE.Vector3(),_f=new THREE.Vector3(),_u=new THREE.Vector3(),_q=new THREE.Vector3();
function bez(out,a,c,b,u){const k=1-u;out.set(k*k*a.x+2*k*u*c.x+u*u*b.x,k*k*a.y+2*k*u*c.y+u*u*b.y,k*k*a.z+2*k*u*c.z+u*u*b.z);return out;}
window.renderAt=(t)=>{
  cam(t);
  // gente
  const walkIn=ease(clamp((t-MK.manda-.3)/2.6))*.45;
  for(const p of people){
    let x=p.hx,z=p.hz,sw=0;
    if(p.still){const f=p.face;p.g.rotation.y=Math.atan2(f[0]-x,f[1]-z);}
    else{const a=p.w*t+p.ph,s=Math.sin(a),v=Math.cos(a);x+=p.dx*p.amp*s;z+=p.dz*p.amp*s;p.g.rotation.y=Math.atan2(p.dx*v,p.dz*v);sw=.55*Math.sin(t*7+p.ph)*Math.abs(v);}
    if(p.marker&&walkIn>0){const tx=lerp(x,DOOR.x,walkIn),tz=lerp(z,DOOR.z+1.5,walkIn);if(walkIn>.01){p.g.rotation.y=Math.atan2(DOOR.x-x,DOOR.z-z);sw=.55*Math.sin(t*8+p.ph);}x=tx;z=tz;}
    p.g.position.set(x,.02*Math.sin(t*3+p.ph),z);
    p.legs[0].rotation.x=sw;p.legs[1].rotation.x=-sw;p.arms[0].rotation.x=-sw*.8;
    if(p.marker){const s=pop(t,p.tm,.35);p.marker.visible=s>0;p.marker.scale.setScalar(Math.max(s,1e-3)*1.5);p.marker.position.set(x,3.0+.12*Math.sin(t*3+p.ph),z);
      p.phoneMat.emissive.setHex(0x22c55e);p.phoneMat.emissiveIntensity=s>0?1.2:0;}
  }
  HERO.head.rotation.x=t<MK.essa?.5:0;
  // lupa
  const ls=pop(t,MK.km1+.6)*(1-ease(clamp((t-MK.impulsiona+.4)/.3)));lupa.visible=ls>.001;
  lupa.position.set(8.5,3.8+.15*Math.sin(t*3),6.1);lupa.scale.setScalar(Math.max(ls,1e-3)*1.4);lupa.lookAt(camera.position);
  // tracejado
  dashes.forEach((d,i)=>{d.visible=t>MK.km1+.2+i*.09&&t<MK.essa;});
  // pino
  const pv=pop(t,MK.impulsiona-.2,.4)*(t<MK.entao?1:0)+(t>=MK.manda+.2?pop(t,MK.manda+.2,.4):0);
  pin.visible=pv>.001;pin.scale.setScalar(Math.max(pv,1e-3)*1.6);pin.position.set(0,6.4+.3*Math.sin(t*2.5),-.6);
  // cards
  for(const c of cards){const k=t-c.t0;if(k<0||t>MK.no+.4){c.s.visible=false;continue;}c.s.visible=true;const d=2+c.sp*k*(1+k*.35);
    c.s.position.set(Math.sin(c.th)*d,4+c.hy*clamp(k*1.5)+d*.02,-.6+Math.cos(c.th)*d);c.s.material.opacity=clamp(k*6)*(1-clamp((t-MK.no+.1)/.3));}
  // raio
  const ru=ease(clamp((t-MK.circulo+.25)/1.3));ring.visible=ru>0;ringGeo.setDrawRange(0,6*Math.floor(160*ru));
  disc.material.opacity=.16*ease(clamp((t-MK.circulo-.6)/.8));
  ring.material.color.setHSL(.39,.7,.45+.08*Math.sin(t*4));
  radDashes.forEach((d,i)=>{d.visible=t>MK.tipo-.3+i*.06&&t<MK.so+.2;});
  // balões
  let arrived=0,glow=0;
  for(const b of bubbles){const u=(t-b.t0)/(b.t1-b.t0);if(t>=b.t1){arrived++;glow+=Math.exp(-(t-b.t1)*6);}
    if(u<0||u>1){b.g.visible=false;continue;}b.g.visible=true;
    const A=_v.set(b.p.g.position.x,3.2,b.p.g.position.z);const C=_q.set((A.x+DOOR.x)/2,7.5,(A.z+DOOR.z)/2);
    bez(b.g.position,A,C,DOOR,ease(u));b.g.scale.setScalar(1.1*easeOutBack(clamp(u*4))*(u>.9?(1-u)*10:1)+1e-3);b.g.lookAt(camera.position);}
  wallMat.emissive.setHex(0x22c55e);wallMat.emissiveIntensity=.55*Math.min(glow,1.4);
  // moedas
  for(const m of coins){const fall=.42,k=t-(m.tl-fall);if(k<0){m.c.visible=false;continue;}m.c.visible=t<MK.manda+.9;
    let y;if(k<fall){const u=k/fall;y=lerp(7,m.y,u*u);}else{const q=k-fall;y=m.y+.25*Math.abs(Math.sin(q*12))*Math.exp(-q*9);}
    m.c.position.y=y;m.c.rotation.y=t*2;}
  // celular
  const ps=pop(t,MK.botao+.45,.4)*(1-ease(clamp((t-MK.entao-.1)/.35)));phone.visible=ps>.001;
  if(phone.visible){_f.set(0,0,-1).applyQuaternion(camera.quaternion);_u.set(0,1,0).applyQuaternion(camera.quaternion);
    phone.position.copy(camera.position).addScaledVector(_f,4).addScaledVector(_u,.36-(1-ps)*.5);
    phone.quaternion.copy(camera.quaternion);phone.rotateY(.1*Math.sin(t*1.3));phone.rotateX(.04*Math.sin(t*1.1));phone.scale.setScalar(Math.max(ps,1e-3));
    screenMat.map=t<MK.mensagem?adTex:chatTex;screenMat.needsUpdate=true;
    const tk=t-MK.whats-.15;tap.visible=tk>0&&tk<.9&&t<MK.mensagem;if(tap.visible){tap.scale.setScalar(1+tk*5);tap.material.opacity=.95*(1-tk/.9);}}
  // etiquetas
  for(const p of pills){
    let o=0,s=1;
    if(t>=p.t0&&t<p.t1){const a=clamp((t-p.t0)/.22);s=lerp(.55,1,easeOutBack(a));o=clamp(a*3)*(1-clamp((t-(p.t1-.15))/.15));}
    if(o<=0){p.el.style.opacity=0;continue;}
    if(p.count){const n=arrived;const txt='CONVERSAS: '+n;if(p.sp.textContent!==txt)p.sp.textContent=txt;}
    let x,y;const w=p.el.offsetWidth,h=p.el.offsetHeight;
    if(p.scr){[x,y]=p.scr;}else{_v.copy(p.v).project(camera);if(_v.z>1){p.el.style.opacity=0;continue;}x=(_v.x+1)/2*W;y=(1-_v.y)/2*H;}
    x=clamp(x,w/2+40,W-w/2-40);y=clamp(y,150,H-760);
    p.el.style.opacity=o;p.el.style.transform=`translate(${x-w/2}px,${y-h/2}px) scale(${s})`;
  }
  // legenda
  let wi=-1;for(let i=0;i<WORDS.length;i++)if(t>=WORDS[i][1])wi=i;
  if(wi<0||t>MK.fim+.25){cap.textContent='';}else{cap.textContent=WORDS[wi][0];const a=clamp((t-WORDS[wi][1])/.09);cap.style.transform=`scale(${lerp(1.18,1,ease(a))})`;}
  renderer.render(scene,camera);
};

  adTex=canvasTex(540,1080,drawAd);chatTex=canvasTex(540,1080,drawChat);

  SFX.sort((a,b)=>a.t-b.t);window.DUR=DUR;window.renderAt(0);window.ready=true;})();
