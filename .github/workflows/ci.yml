name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Varredura de dado sensível
        run: python testes/varredura.py

      - name: Todo .py compila
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Todo .sh tem sintaxe válida
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: Servidor MCP (código da pasta src)
        run: python testes/testar_mcp.py

      - name: Monta o pacote (sdist e wheel)
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Servidor MCP (wheel instalado num ambiente limpo)
        run: |
          python -m venv /tmp/kit
          /tmp/kit/bin/pip install dist/*.whl
          cd /tmp && python "$GITHUB_WORKSPACE/testes/testar_mcp.py" /tmp/kit/bin/kit-trafego-ia
